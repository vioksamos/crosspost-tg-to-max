name: Кросспостинг Telegram → VK + MAX

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка ручного запуска
    inputs:
      mode:
        description: "run — переслать посты, chats — узнать ID канала MAX"
        default: "run"

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python bot.py ${{ github.event.inputs.mode || 'run' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
